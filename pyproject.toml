[project]
name = "icarus-dashboard"
version = "0.1.0"
description = "Local macOS workspace for coding and AI tools, notes, journals, and optional trading integrations."
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "pyobjc-core>=12.2.1",
    "pyobjc-framework-cocoa>=12.2.1",
    "pyobjc-framework-webkit>=12.2.1",
    "pystray>=0.19.5",
    "pywebview>=6.2.1",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
